stages:
  - deploy

deploy_ec2:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-add "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$EC2_USER@$EC2_HOST" "cd ~/cpd && bash update.sh"
