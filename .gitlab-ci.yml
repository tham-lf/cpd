# GitLab CI/CD — staggered counterpart to .github/workflows/scrape.yml
#
# Schedule this pipeline in the GitLab UI:
#   Project → CI/CD → Schedules → New schedule
#   Cron:  0 6 * * *      (06:00 UTC = 14:00 SGT)
#   Variables (mark as Protected/Masked as appropriate):
#     DATABASE_URL, OPENAI_API_KEY,
#     TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID,
#     WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_CHANNEL_ID,
#     FORCE_BROADCAST (optional: "true" to override the no-new-entries guard)
#
# Pairs with the GitHub workflow at 18:00 UTC; together they poll the SILE site
# every 12h. Double-broadcasts are prevented by the diff-aware digest — the
# second runner finds 0 new EventIDs since the first runner's scrape and skips.

image: mcr.microsoft.com/playwright/python:v1.47.0-jammy

stages:
  - scrape
  - broadcast

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

.only_scheduled_or_manual: &only_scheduled_or_manual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

scrape:
  stage: scrape
  <<: *only_scheduled_or_manual
  timeout: 45 minutes
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python cpd_scraper.py

broadcast_telegram:
  stage: broadcast
  needs: [scrape]
  <<: *only_scheduled_or_manual
  script:
    - pip install --no-cache-dir -r requirements.txt
    - |
      if [ "$FORCE_BROADCAST" = "true" ]; then
        python bot.py broadcast --force
      else
        python bot.py broadcast
      fi

broadcast_whatsapp:
  stage: broadcast
  needs: [scrape]
  <<: *only_scheduled_or_manual
  script:
    - pip install --no-cache-dir -r requirements.txt
    - |
      if [ "$FORCE_BROADCAST" = "true" ]; then
        python whatsapp_bot.py broadcast --force
      else
        python whatsapp_bot.py broadcast
      fi
